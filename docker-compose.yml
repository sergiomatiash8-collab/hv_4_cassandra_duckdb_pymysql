version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: adtech_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: adtech_root
      MYSQL_DATABASE: adtech_gold
      MYSQL_USER: adtech_user
      MYSQL_PASSWORD: adtech_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --innodb-buffer-pool-size=4G
      --innodb-log-file-size=256M
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --max-allowed-packet=256M
      --bulk-insert-buffer-size=256M

  cassandra:
    image: cassandra:4.1
    container_name: adtech_cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=adtech_cluster
      - CASSANDRA_DC=dc1
      - HEAP_NEWSIZE=128M
      - MAX_HEAP_SIZE=512M
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
      - CASSANDRA_BROADCAST_RPC_ADDRESS=127.0.0.1

volumes:
  mysql_data:
  cassandra_data: